<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Live · Clase de 6to</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='%23D91F26'/%3E%3Ccircle cx='20' cy='20' r='6' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    --paper: #fff;
    --coral: #FF3040;
    --school: #3B5EF0;
    --lemon: #F5DE3A;
    --f-display: 'Bricolage Grotesque', system-ui, sans-serif;
    --f-body: 'Manrope', system-ui, sans-serif;
    --f-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: var(--f-body); -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; color: inherit; }

  .live-app { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }

  #jitsi { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; background: #000; }
  #jitsi iframe { width: 100% !important; height: 100% !important; border: 0 !important; }

  .live-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; }

  /* Header */
  .live-head { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: linear-gradient(to bottom, rgba(0,0,0,.65), transparent); }
  .live-head-avatar { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; color: #fff; font-family: var(--f-display); font-weight: 800; font-size: 15px; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  .live-head-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .live-head-info { flex: 1; min-width: 0; }
  .live-head-name { font-family: var(--f-display); font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .live-head-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--coral); color: #fff; font-family: var(--f-mono); font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
  .live-head-tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: livePulse 1.4s ease-in-out infinite; }
  @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .live-head-meta { font-family: var(--f-mono); font-size: 10px; opacity: .82; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
  .live-close { pointer-events: auto; width: 36px; height: 36px; border-radius: 999px; background: rgba(0,0,0,.5); backdrop-filter: blur(8px); display: grid; place-items: center; margin-left: auto; }
  .live-close:hover { background: rgba(0,0,0,.75); }
  .live-ctrls { pointer-events: auto; display: flex; gap: 6px; margin-left: auto; }
  .live-ctrl {
    width: 40px; height: 40px; border-radius: 999px;
    background: rgba(255,255,255,.14); backdrop-filter: blur(8px);
    color: #fff; display: grid; place-items: center;
    font-size: 15px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.18);
    transition: background .18s, transform .12s;
  }
  .live-ctrl:hover { background: rgba(255,255,255,.28); transform: scale(1.05); }
  .live-ctrl:active { transform: scale(.95); }
  .live-ctrl.off { background: var(--coral); border-color: var(--coral); }
  .live-ctrl svg { width: 18px; height: 18px; }

  /* Comments layer (flow up from bottom) */
  .live-comments { position: absolute; left: 12px; right: 90px; bottom: 90px; max-height: 55%; display: flex; flex-direction: column-reverse; gap: 6px; pointer-events: none; overflow: hidden; }
  .live-comment { display: flex; align-items: start; gap: 8px; max-width: 100%; opacity: 0; transform: translateY(20px); animation: commentIn .35s cubic-bezier(.2,.9,.3,1.2) forwards, commentOut .5s ease 6s forwards; }
  @keyframes commentIn { to { opacity: 1; transform: translateY(0); } }
  @keyframes commentOut { to { opacity: 0; transform: translateY(-20px); } }
  .live-comment .lc-avatar { width: 26px; height: 26px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; color: #fff; font-family: var(--f-display); font-weight: 800; font-size: 11px; flex-shrink: 0; }
  .live-comment .lc-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .live-comment .lc-body { max-width: calc(100% - 34px); padding: 6px 12px; border-radius: 14px; background: rgba(0,0,0,.55); backdrop-filter: blur(8px); font-size: 13px; line-height: 1.35; word-wrap: break-word; }
  .live-comment .lc-body strong { display: block; font-weight: 800; font-size: 11px; opacity: .85; margin-bottom: 1px; }
  .live-comment.join .lc-body { background: rgba(59,94,240,.6); }
  .live-comment.join .lc-body::before { content: "👋 "; }
  .live-comment.gift .lc-body { background: linear-gradient(135deg, rgba(217,31,38,.75), rgba(245,222,58,.6)); }
  .live-comment.gift .lc-body strong { color: #fff; }

  /* Gift bursts */
  .live-gifts { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .gift-fly { position: absolute; font-size: 48px; text-shadow: 0 4px 12px rgba(0,0,0,.6); animation: giftFly 3.6s cubic-bezier(.4,0,.5,1) forwards; will-change: transform, opacity; }
  @keyframes giftFly {
    0% { transform: translateY(20vh) scale(.4) rotate(-20deg); opacity: 0; }
    15% { transform: translateY(10vh) scale(1.4) rotate(6deg); opacity: 1; }
    30% { transform: translateY(-10vh) scale(1) rotate(-4deg); opacity: 1; }
    100% { transform: translateY(-90vh) scale(.6) rotate(20deg); opacity: 0; }
  }
  .gift-big { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(0); font-size: 120px; text-shadow: 0 8px 24px rgba(0,0,0,.7); animation: giftBig 2.4s ease forwards; pointer-events: none; z-index: 20; }
  @keyframes giftBig {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-30deg); opacity: 0; }
    20% { transform: translate(-50%, -50%) scale(1.3) rotate(10deg); opacity: 1; }
    60% { transform: translate(-50%, -50%) scale(1) rotate(-5deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.5) rotate(0); opacity: 0; }
  }

  /* Likes side counter */
  .live-hearts { position: absolute; right: 10px; bottom: 90px; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; z-index: 12; }
  .heart-fly { font-size: 28px; animation: heartFly 2.4s ease-out forwards; }
  @keyframes heartFly {
    0% { opacity: 0; transform: translateY(0) scale(.5); }
    15% { opacity: 1; transform: translateY(-20px) scale(1.2); }
    100% { opacity: 0; transform: translateY(-180px) scale(.9) translateX(-40px); }
  }

  /* Composer */
  .live-composer { pointer-events: auto; position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px 14px; padding-bottom: max(14px, env(safe-area-inset-bottom)); background: linear-gradient(to top, rgba(0,0,0,.7), transparent); display: flex; gap: 8px; align-items: center; z-index: 15; }
  .live-composer input { flex: 1; padding: 12px 16px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); color: #fff; font-size: 14px; outline: none; backdrop-filter: blur(8px); }
  .live-composer input::placeholder { color: rgba(255,255,255,.6); }
  .live-composer input:focus { border-color: rgba(255,255,255,.5); background: rgba(255,255,255,.18); }
  .live-composer .lc-btn { width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); font-size: 20px; backdrop-filter: blur(8px); flex-shrink: 0; }
  .live-composer .lc-btn:hover { background: rgba(255,255,255,.24); }
  .live-composer .lc-btn.primary { background: var(--coral); border-color: var(--coral); }
  .live-composer .lc-btn.primary:hover { background: #ff4a58; }

  /* Gift picker popup */
  .gift-picker { pointer-events: auto; position: absolute; right: 12px; bottom: 74px; background: rgba(20,20,20,.92); backdrop-filter: blur(12px); border-radius: 16px; padding: 12px; z-index: 20; box-shadow: 0 12px 40px rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.14); width: 280px; max-width: calc(100vw - 24px); }
  .gift-picker[hidden] { display: none; }
  .gift-picker .gp-title { font-family: var(--f-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,.55); font-weight: 700; margin: 4px 4px 6px; }
  .gift-picker .gp-title:first-child { margin-top: 0; }
  .gift-picker .gp-specials { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .gift-picker .gp-special { padding: 12px 8px 10px; border-radius: 12px; background: linear-gradient(135deg, rgba(217,31,38,.28), rgba(107,62,232,.24)); display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; border: 1px solid rgba(255,255,255,.12); }
  .gift-picker .gp-special:hover { background: linear-gradient(135deg, rgba(217,31,38,.5), rgba(107,62,232,.4)); transform: translateY(-2px); }
  .gift-picker .gp-special .gp-ico { font-size: 26px; }
  .gift-picker .gp-special .gp-label { font-size: 10px; font-weight: 800; color: #fff; letter-spacing: -0.01em; }
  .gift-picker .gp-emojis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .gift-picker .gp-emoji { width: 100%; aspect-ratio: 1; border-radius: 10px; font-size: 24px; background: rgba(255,255,255,.06); display: grid; place-items: center; }
  .gift-picker .gp-emoji:hover { background: rgba(255,255,255,.18); transform: scale(1.06); }

  /* ============ SPECIAL GIFT: ESCUDO 6to ============ */
  .fx-escudo { position: absolute; inset: 0; pointer-events: none; z-index: 22; overflow: hidden; }
  .fx-escudo .bg-flash { position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(59,94,240,.5), transparent 70%); animation: bgFlash 3.5s ease forwards; }
  @keyframes bgFlash { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
  .fx-escudo .shield { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(0); animation: shieldShow 4s cubic-bezier(.35,.9,.4,1.1) forwards; filter: drop-shadow(0 12px 40px rgba(59,94,240,.6)); }
  .fx-escudo .shield img { width: 260px; height: 260px; border-radius: 24px; display: block; }
  @keyframes shieldShow {
    0%   { transform: translate(-50%,-50%) scale(0) rotate(-240deg); opacity: 0; filter: blur(12px) drop-shadow(0 0 0 rgba(59,94,240,0)); }
    15%  { transform: translate(-50%,-50%) scale(1.35) rotate(20deg); opacity: 1; filter: blur(0) drop-shadow(0 12px 40px rgba(59,94,240,.7)); }
    28%  { transform: translate(-50%,-50%) scale(1) rotate(-8deg); }
    42%  { transform: translate(-50%,-50%) scale(1.1) rotate(5deg); }
    56%  { transform: translate(-50%,-50%) scale(1) rotate(0); }
    72%  { transform: translate(-50%,-50%) scale(1.25) rotate(180deg); }
    85%  { transform: translate(-50%,-50%) scale(1.05) rotate(360deg); }
    100% { transform: translate(-50%,-50%) scale(0.2) rotate(540deg); opacity: 0; }
  }
  .fx-escudo .spark { position: absolute; width: 14px; height: 14px; font-size: 14px; color: #F5DE3A; animation: sparkFly 2.4s ease-out forwards; }
  @keyframes sparkFly { 0% { opacity: 0; transform: translate(0,0) scale(0); } 15% { opacity: 1; transform: translate(0,0) scale(1.2); } 100% { opacity: 0; transform: translate(var(--x, 200px), var(--y, -200px)) scale(.3); } }
  .fx-escudo .ring { position: absolute; left: 50%; top: 50%; width: 80px; height: 80px; border-radius: 50%; border: 3px solid rgba(255,255,255,.7); transform: translate(-50%,-50%); animation: ringExpand 2s ease-out forwards; }
  @keyframes ringExpand { 0% { width: 80px; height: 80px; opacity: 1; border-width: 4px; } 100% { width: 800px; height: 800px; opacity: 0; border-width: 1px; } }

  /* ============ SPECIAL GIFT: CONCIERTO D+M ============ */
  .fx-concierto { position: absolute; inset: 0; pointer-events: none; z-index: 22; overflow: hidden; animation: fxConciertoRoot 6s forwards; }
  @keyframes fxConciertoRoot {
    0% { opacity: 0; }
    8% { opacity: 1; }
    92% { opacity: 1; }
    100% { opacity: 0; }
  }
  .fx-concierto .stage {
    position: absolute; left: 0; right: 0; bottom: -8%;
    height: 44%;
    background: linear-gradient(to top, #0a0a12 0%, #201033 100%);
    border-top: 4px solid rgba(255,255,255,.15);
  }
  .fx-concierto .stage::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 30% 0%, rgba(255,220,80,.35), transparent 55%),
      radial-gradient(circle at 70% 0%, rgba(255,80,180,.35), transparent 55%);
    animation: stageLights 2.4s ease-in-out infinite alternate;
  }
  @keyframes stageLights {
    0% { background-position: 0% 0%, 0% 0%; opacity: .8; }
    100% { background-position: 15% 0%, -15% 0%; opacity: 1; }
  }
  .fx-concierto .beam {
    position: absolute; top: 0; width: 60vw; height: 100%;
    background: linear-gradient(to bottom, rgba(255,220,80,.35), transparent);
    clip-path: polygon(48% 0, 52% 0, 100% 100%, 0% 100%);
    transform-origin: 50% 0%;
  }
  .fx-concierto .beam.a { left: 20%; animation: beamSway 3s ease-in-out infinite alternate; }
  .fx-concierto .beam.b { right: 20%; animation: beamSway 3s ease-in-out infinite alternate-reverse; filter: hue-rotate(200deg); }
  @keyframes beamSway { 0% { transform: rotate(-14deg); } 100% { transform: rotate(14deg); } }

  .fx-concierto .band {
    position: absolute; left: 50%; bottom: 4%;
    transform: translateX(-50%) scale(0.9);
    animation: bandCamera 6s cubic-bezier(.4,0,.5,1) forwards;
    display: flex; align-items: flex-end; gap: 30px;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,.65));
  }
  @keyframes bandCamera {
    0%   { transform: translateX(-50%) scale(0.4) translateY(80px); opacity: 0; }
    10%  { transform: translateX(-50%) scale(0.95); opacity: 1; }
    35%  { transform: translateX(-50%) scale(1); }
    52%  { transform: translate(-30%, -6%) scale(1.6); }   /* zoom close-up singer */
    68%  { transform: translate(-72%, -6%) scale(1.6); }   /* pan to drummer */
    85%  { transform: translateX(-50%) scale(1); }         /* wide again */
    100% { transform: translateX(-50%) scale(0.7); opacity: 0; }
  }
  .fx-concierto .char { position: relative; }
  .fx-concierto .char.singer { animation: singerSway 0.9s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  .fx-concierto .char.drummer { animation: drummerBounce 0.28s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes singerSway { 0% { transform: rotate(-4deg); } 100% { transform: rotate(4deg); } }
  @keyframes drummerBounce { 0% { transform: translateY(0); } 100% { transform: translateY(-3px); } }

  .fx-concierto .note {
    position: absolute; font-size: 24px; color: #fff;
    animation: noteFloat 2.6s ease-in forwards;
    text-shadow: 0 0 8px rgba(255,255,255,.6);
  }
  @keyframes noteFloat {
    0% { opacity: 0; transform: translateY(0) rotate(-10deg) scale(.4); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-260px) rotate(30deg) scale(1.2); }
  }
  .fx-concierto .banner {
    position: absolute; left: 50%; top: 10%;
    transform: translateX(-50%);
    color: #fff; font-family: var(--f-display); font-weight: 800;
    font-size: clamp(24px, 5vw, 40px);
    letter-spacing: -0.02em;
    text-shadow: 0 4px 16px rgba(0,0,0,.8);
    animation: bannerIn 6s ease forwards; opacity: 0;
  }
  @keyframes bannerIn {
    0% { opacity: 0; transform: translate(-50%, -30px); }
    10% { opacity: 1; transform: translate(-50%, 0); }
    88% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -30px); }
  }
  .fx-concierto .banner small { display: block; font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.2em; opacity: .85; font-weight: 600; text-transform: uppercase; }

  /* Broadcast start screen */
  .live-splash { position: absolute; inset: 0; background: linear-gradient(135deg, #1E3AAB, #6B3EE8); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 30; }
  .live-splash h1 { font-family: var(--f-display); font-size: clamp(28px, 5vw, 44px); font-weight: 800; margin: 12px 0 8px; letter-spacing: -0.02em; }
  .live-splash p { opacity: .85; margin: 0 0 24px; max-width: 42ch; font-size: 15px; }
  .live-splash input { width: 100%; max-width: 340px; padding: 14px 18px; border-radius: 12px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); color: #fff; font-size: 15px; outline: none; margin-bottom: 14px; }
  .live-splash input::placeholder { color: rgba(255,255,255,.6); }
  .live-splash button { padding: 14px 28px; border-radius: 999px; background: var(--coral); color: #fff; font-weight: 800; font-size: 16px; }
  .live-splash button:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,48,64,.4); }
  .live-splash .ghost { background: transparent; border: 1px solid rgba(255,255,255,.28); margin-top: 10px; }
  .live-splash .icon { font-size: 64px; }

  .loading-full { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.7); font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; background: #000; z-index: 40; }
</style>
</head>
<body>

<div class="live-app">
  <div id="jitsi"></div>
  <div class="live-overlay" id="overlay" hidden>
    <div class="live-head">
      <div class="live-head-avatar" id="headAvatar"></div>
      <div class="live-head-info">
        <div class="live-head-name" id="headName">
          <span></span> <span class="live-head-tag">Live</span>
        </div>
        <div class="live-head-meta" id="headMeta">— viewers</div>
      </div>
      <div class="live-ctrls" id="liveCtrls"></div>
      <button class="live-close" id="closeBtn" aria-label="Cerrar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="live-comments" id="comments"></div>
    <div class="live-gifts" id="gifts"></div>
    <div class="live-hearts" id="hearts"></div>
    <div class="gift-picker" id="giftPicker" hidden></div>
    <form class="live-composer" id="composer">
      <input id="chatInput" placeholder="Escribí un mensaje…" autocomplete="off" maxlength="200">
      <button type="button" class="lc-btn" id="giftBtn" aria-label="Regalo">🎁</button>
      <button type="button" class="lc-btn" id="heartBtn" aria-label="Me gusta">❤️</button>
      <button type="submit" class="lc-btn primary" aria-label="Enviar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
  </div>

  <div class="live-splash" id="splash" hidden>
    <div class="icon">🔴</div>
    <h1>Nuevo live</h1>
    <p>Vas a transmitir en vivo para los del salón. Tu cámara y mic se van a activar. Los que entren solo van a ver — no pueden abrir su cámara.</p>
    <input id="liveTitleInput" placeholder="Título (ej. Vamos por el partido)" maxlength="60">
    <button id="startLiveBtn" type="button">Empezar transmisión</button>
    <button class="ghost" id="cancelBtn" type="button">Cancelar</button>
  </div>

  <div class="loading-full" id="loading">Cargando…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://meet.jit.si/external_api.js"></script>
<script>

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

  const PALETTE = ['#1E3AAB','#3B5EF0','#6B3EE8','#D91F26','#35C89A','#0C1846','#C68416','#7A4A00'];
  function colorFor(name) { let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0; return PALETTE[h%PALETTE.length]; }
  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function slug(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,''); }
  function keyOf(name, section){ return `${section}-${slug(name)}`.toLowerCase(); }

  const GIFTS = ['🎁','🌹','💎','🦁','🍕','✨','🔥','🎉','🚀','👑','⚡','🌈','🍀','💯'];
  const SPECIAL_GIFTS = [
    { id: 'gift:escudo',    ico: '🛡️', label: 'Escudo 6to' },
    { id: 'gift:concierto', ico: '🎸', label: 'Concierto D+M' },
  ];

  const q = new URLSearchParams(location.search);
  const liveIdParam = q.get('id');
  const startAsNew = q.get('new') === '1';

  let me = null, myProfile = null;
  let profilesById = new Map();
  let live = null;
  let jitsi = null;
  let realtimeSub = null;
  let composerEl, chatInput, giftBtn, heartBtn, giftPicker;

  const $ = id => document.getElementById(id);
  const loading = $('loading');
  const overlay = $('overlay');
  const splash = $('splash');

  function setLoading(msg) { loading.hidden = false; loading.innerHTML = msg; }
  function bail(msg) {
    setLoading(`${msg}<br><br><a href="/" style="color:#fff;text-decoration:underline">Volver al inicio</a>&nbsp;·&nbsp;<a href="javascript:location.reload()" style="color:#fff;text-decoration:underline">Reintentar</a>`);
  }
  function withTimeout(promise, ms, label) {
    return Promise.race([
      promise,
      new Promise((_, r) => setTimeout(() => r(new Error(`timeout: ${label}`)), ms))
    ]);
  }

  async function boot() {
    // Fallback watchdog: si en 15s no cambia loading a hidden, mostrar error
    const watchdog = setTimeout(() => {
      if (!loading.hidden) bail('Muy lento — algo no anda bien.');
    }, 15000);

    setLoading('Conectando…');
    try {
      const { data: { session } } = await withTimeout(sb.auth.getSession(), 5000, 'getSession');
      if (session && session.user) {
        me = session.user;
      } else {
        setLoading('Iniciando sesión…');
        const { data, error } = await withTimeout(sb.auth.signInAnonymously(), 8000, 'signIn');
        if (error) throw error;
        me = data.user;
      }
    } catch(e){
      console.error('auth', e);
      clearTimeout(watchdog);
      bail('No se pudo conectar a Supabase (' + (e.message || 'error') + ').');
      return;
    }

    setLoading('Cargando perfiles…');
    let profs;
    try {
      const r = await withTimeout(
        sb.from('profiles').select('user_id, name, section, role, avatar_url'),
        8000, 'profiles');
      if (r.error) throw r.error;
      profs = r.data;
    } catch(e){
      console.error('profiles', e);
      clearTimeout(watchdog);
      bail('No se pudieron cargar los perfiles.');
      return;
    }
    (profs || []).forEach(p => profilesById.set(p.user_id, p));
    myProfile = me ? profilesById.get(me.id) : null;

    if (startAsNew) {
      if (!myProfile) {
        clearTimeout(watchdog);
        bail('Necesitás reclamar tu nombre primero.');
        return;
      }
      if (typeof JitsiMeetExternalAPI === 'undefined') {
        clearTimeout(watchdog);
        bail('No se pudo cargar el motor de video (Jitsi). Revisá tu WiFi.');
        return;
      }
      clearTimeout(watchdog);
      loading.hidden = true;
      showSplash();
      return;
    }

    if (!liveIdParam) {
      clearTimeout(watchdog);
      bail('Faltó el id del live.');
      return;
    }

    setLoading('Buscando el live…');
    let liveRow;
    try {
      const r = await withTimeout(
        sb.from('lives').select('*').eq('id', liveIdParam).maybeSingle(),
        8000, 'live lookup');
      if (r.error) throw r.error;
      liveRow = r.data;
    } catch(e){
      console.error('lives', e);
      clearTimeout(watchdog);
      bail('No se pudo cargar el live.');
      return;
    }
    if (!liveRow) { clearTimeout(watchdog); bail('Live no encontrado.'); return; }
    if (liveRow.ended_at) { clearTimeout(watchdog); bail('Este live ya terminó.'); return; }
    live = liveRow;
    if (typeof JitsiMeetExternalAPI === 'undefined') {
      clearTimeout(watchdog);
      bail('No se pudo cargar el motor de video (Jitsi). Revisá tu WiFi.');
      return;
    }
    clearTimeout(watchdog);
    joinLive(live.broadcaster_user_id === me.id);
  }

  function showSplash() {
    splash.hidden = false;
    const titleInp = $('liveTitleInput');
    titleInp.focus();
    $('startLiveBtn').addEventListener('click', async () => {
      const title = titleInp.value.trim() || `Live de ${myProfile.name}`;
      const room = `pana6to-${Math.random().toString(36).slice(2, 10)}-${Date.now().toString(36)}`;
      const { data, error } = await sb.from('lives').insert({
        broadcaster_user_id: me.id, title, room_name: room
      }).select().single();
      if (error) { alert('Error: ' + error.message); return; }
      live = data;
      splash.hidden = true;
      joinLive(true);
      history.replaceState({}, '', `/live/?id=${live.id}`);
    });
    $('cancelBtn').addEventListener('click', () => { location.href = '/'; });
  }

  function joinLive(isBroadcaster) {
    loading.hidden = true;
    const broadcaster = profilesById.get(live.broadcaster_user_id);
    const bName = broadcaster ? broadcaster.name : 'Anónimo';
    const bColor = colorFor(bName);
    const bAv = broadcaster && broadcaster.avatar_url ? `<img src="${escapeHtml(broadcaster.avatar_url)}" alt="">` : bName[0].toUpperCase();

    $('headAvatar').style.background = bColor;
    $('headAvatar').innerHTML = bAv;
    $('headName').innerHTML = `<span>${escapeHtml(bName)}</span><span class="live-head-tag">Live</span>`;
    $('headMeta').textContent = live.title ? escapeHtml(live.title) : '';

    overlay.hidden = false;
    initJitsi(isBroadcaster);
    wireComposer(isBroadcaster);
    loadRecentMessages();
    subscribeLive();

    // Post join event
    if (!isBroadcaster) {
      postMessage('join', null, null);
    }

    $('closeBtn').addEventListener('click', () => {
      if (isBroadcaster) {
        if (!confirm('¿Terminar la transmisión?')) return;
        endLive();
      } else {
        location.href = '/';
      }
    });
  }

  function initJitsi(isBroadcaster) {
    const displayName = myProfile ? myProfile.name : 'Anónimo';
    const opts = {
      roomName: live.room_name,
      width: '100%', height: '100%',
      parentNode: $('jitsi'),
      userInfo: { displayName },
      configOverwrite: {
        prejoinPageEnabled: false,
        startWithAudioMuted: !isBroadcaster,
        startWithVideoMuted: !isBroadcaster,
        disableInviteFunctions: true,
        toolbarButtons: isBroadcaster
          ? ['microphone', 'camera', 'hangup', 'settings', 'raisehand', 'tileview', 'fullscreen']
          : ['hangup', 'fullscreen'],
        readOnlyName: true,
      },
      interfaceConfigOverwrite: {
        MOBILE_APP_PROMO: false,
        SHOW_JITSI_WATERMARK: false,
        SHOW_WATERMARK_FOR_GUESTS: false,
        HIDE_INVITE_MORE_HEADER: true,
        DEFAULT_BACKGROUND: '#000',
        DISABLE_JOIN_LEAVE_NOTIFICATIONS: true,
      }
    };
    jitsi = new JitsiMeetExternalAPI('meet.jit.si', opts);
    jitsi.addListener('participantJoined', updateViewerCount);
    jitsi.addListener('participantLeft', updateViewerCount);
    jitsi.addListener('readyToClose', () => {
      if (isBroadcaster) endLive();
      else location.href = '/';
    });

    // Broadcaster-only mic/camera toggles en el header (encima del overlay)
    if (isBroadcaster) {
      const ctrls = $('liveCtrls');
      ctrls.innerHTML = `
        <button class="live-ctrl" id="micToggle" title="Silenciar micrófono" aria-label="Silenciar micrófono">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
        </button>
        <button class="live-ctrl" id="camToggle" title="Apagar cámara" aria-label="Apagar cámara">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        </button>
      `;
      let micOff = false, camOff = false;
      const micBtn = $('micToggle');
      const camBtn = $('camToggle');
      micBtn.addEventListener('click', () => { try { jitsi.executeCommand('toggleAudio'); } catch(e){} });
      camBtn.addEventListener('click', () => { try { jitsi.executeCommand('toggleVideo'); } catch(e){} });
      jitsi.addListener('audioMuteStatusChanged', (e) => {
        micOff = !!e.muted;
        micBtn.classList.toggle('off', micOff);
        micBtn.title = micOff ? 'Activar micrófono' : 'Silenciar micrófono';
        micBtn.setAttribute('aria-label', micBtn.title);
        micBtn.innerHTML = micOff
          ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22"/><path d="M9 9v2a3 3 0 0 0 5.12 2.12M15 9.34V5a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 2a7 7 0 0 1-.11 1.23M12 18v4"/></svg>`
          : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>`;
      });
      jitsi.addListener('videoMuteStatusChanged', (e) => {
        camOff = !!e.muted;
        camBtn.classList.toggle('off', camOff);
        camBtn.title = camOff ? 'Encender cámara' : 'Apagar cámara';
        camBtn.setAttribute('aria-label', camBtn.title);
        camBtn.innerHTML = camOff
          ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22"/><path d="M16 16v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3M9 5h5a2 2 0 0 1 2 2v3l4-3v10"/></svg>`
          : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>`;
      });
    }
    setTimeout(updateViewerCount, 1500);
  }

  async function updateViewerCount() {
    try {
      const n = jitsi.getNumberOfParticipants();
      // n includes broadcaster + viewers. Show n-1 as viewer count, or just n for total
      $('headMeta').innerHTML = `${escapeHtml(live.title || '')}${live.title ? ' · ' : ''}<b>${n}</b> en vivo`;
    } catch(e){}
  }

  function wireComposer(isBroadcaster) {
    composerEl = $('composer');
    chatInput = $('chatInput');
    giftBtn = $('giftBtn');
    heartBtn = $('heartBtn');
    giftPicker = $('giftPicker');
    if (!myProfile) {
      chatInput.disabled = true;
      chatInput.placeholder = 'Reclamá tu nombre para comentar';
      giftBtn.disabled = true; heartBtn.disabled = true;
      composerEl.querySelector('button[type="submit"]').disabled = true;
      return;
    }
    composerEl.addEventListener('submit', (e) => {
      e.preventDefault();
      const t = chatInput.value.trim();
      if (!t) return;
      postMessage('text', t, null);
      chatInput.value = '';
    });
    heartBtn.addEventListener('click', () => {
      spawnHeart();
      postMessage('like', null, null);
    });
    giftBtn.addEventListener('click', () => {
      if (giftPicker.hidden) {
        const specialsHtml = SPECIAL_GIFTS.map(s => `<button type="button" class="gp-special" data-g="${s.id}">
          <span class="gp-ico">${s.ico}</span>
          <span class="gp-label">${s.label}</span>
        </button>`).join('');
        const emojiHtml = GIFTS.map(g => `<button type="button" class="gp-emoji" data-g="${g}">${g}</button>`).join('');
        giftPicker.innerHTML = `
          <div class="gp-title">Especiales</div>
          <div class="gp-specials">${specialsHtml}</div>
          <div class="gp-title">Regalos</div>
          <div class="gp-emojis">${emojiHtml}</div>
        `;
        giftPicker.querySelectorAll('button[data-g]').forEach(b => b.addEventListener('click', () => {
          const g = b.dataset.g;
          giftPicker.hidden = true;
          postMessage('gift', null, g);
        }));
      }
      giftPicker.hidden = !giftPicker.hidden;
    });
    document.addEventListener('click', (e) => {
      if (!giftPicker.hidden && !giftPicker.contains(e.target) && e.target !== giftBtn) giftPicker.hidden = true;
    });
  }

  async function postMessage(kind, text, gift) {
    if (!myProfile) return;
    await sb.from('live_messages').insert({
      live_id: live.id, author_user_id: me.id, kind, text: text || null, gift: gift || null
    });
  }

  async function loadRecentMessages() {
    const { data } = await sb.from('live_messages')
      .select('id, author_user_id, kind, text, gift, created_at')
      .eq('live_id', live.id)
      .order('created_at', { ascending: true })
      .limit(30);
    (data || []).forEach(m => renderMessage(m, /*silent=*/true));
  }

  function subscribeLive() {
    if (realtimeSub) sb.removeChannel(realtimeSub);
    realtimeSub = sb.channel(`live-${live.id}`)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'live_messages', filter: `live_id=eq.${live.id}` }, (payload) => {
        renderMessage(payload.new);
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'lives', filter: `id=eq.${live.id}` }, (payload) => {
        if (payload.new.ended_at && !live.ended_at) {
          live.ended_at = payload.new.ended_at;
          alert('El live terminó');
          location.href = '/';
        }
      })
      .subscribe();
  }

  function renderMessage(m, silent) {
    const author = profilesById.get(m.author_user_id);
    const name = author ? author.name : 'Anónimo';
    const av = author && author.avatar_url ? `<img src="${escapeHtml(author.avatar_url)}" alt="">` : name[0].toUpperCase();

    if (m.kind === 'like') { if (!silent) spawnHeart(); return; }
    if (m.kind === 'gift') { if (!silent) { spawnGift(m.gift); spawnGiftText(name, m.gift); } return; }

    const kindClass = m.kind === 'join' ? ' join' : (m.kind === 'gift' ? ' gift' : '');
    const bodyText = m.kind === 'join' ? 'se unió al live' : escapeHtml(m.text || '');
    const el = document.createElement('div');
    el.className = 'live-comment' + kindClass;
    el.innerHTML = `
      <div class="lc-avatar" style="background:${colorFor(name)}">${av}</div>
      <div class="lc-body"><strong>${escapeHtml(name)}</strong>${bodyText}</div>
    `;
    const list = $('comments');
    list.insertBefore(el, list.firstChild);
    setTimeout(() => el.remove(), 7000);
    // Keep only ~30 latest
    while (list.children.length > 30) list.lastChild.remove();
  }

  function spawnGift(g) {
    if (g === 'gift:escudo')    return spawnEscudo();
    if (g === 'gift:concierto') return spawnConcierto();
    const el = document.createElement('div');
    el.className = 'gift-fly';
    el.textContent = g || '🎁';
    el.style.left = (10 + Math.random() * 80) + '%';
    $('gifts').appendChild(el);
    setTimeout(() => el.remove(), 3800);
  }
  function giftLabel(g) {
    if (g === 'gift:escudo')    return '🛡️ Escudo 6to';
    if (g === 'gift:concierto') return '🎸 Concierto D+M';
    return g || '🎁';
  }
  function spawnGiftText(name, g) {
    // Solo mostrar el "gift-big" y el comment para emojis regulares — los especiales
    // ya son fullscreen y no necesitan el emoji grande.
    const isSpecial = g && g.startsWith('gift:');
    if (!isSpecial) {
      const big = document.createElement('div');
      big.className = 'gift-big';
      big.textContent = g || '🎁';
      $('gifts').appendChild(big);
      setTimeout(() => big.remove(), 2600);
    }
    // Insert as a comment (always)
    const el = document.createElement('div');
    el.className = 'live-comment gift';
    el.innerHTML = `
      <div class="lc-avatar" style="background:${colorFor(name)}">${name[0].toUpperCase()}</div>
      <div class="lc-body"><strong>${escapeHtml(name)}</strong>mandó ${giftLabel(g)}</div>
    `;
    const list = $('comments');
    list.insertBefore(el, list.firstChild);
    setTimeout(() => el.remove(), 7000);
  }
  function spawnHeart() {
    const el = document.createElement('div');
    el.className = 'heart-fly';
    el.textContent = ['❤️','💛','💜','💙','🧡'][Math.floor(Math.random()*5)];
    $('hearts').appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }

  // =========== SPECIAL GIFT: escudo 6to ===========
  function spawnEscudo() {
    const fx = document.createElement('div');
    fx.className = 'fx-escudo';
    fx.innerHTML = `
      <div class="bg-flash"></div>
      <div class="ring"></div>
      <div class="shield"><img src="/logo-6to.jpg" alt=""></div>
    `;
    // Sparks radiating out
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      s.textContent = '✨';
      const angle = (i / 14) * Math.PI * 2;
      const dist = 240 + Math.random() * 120;
      s.style.left = '50%'; s.style.top = '50%';
      s.style.setProperty('--x', (Math.cos(angle) * dist) + 'px');
      s.style.setProperty('--y', (Math.sin(angle) * dist) + 'px');
      s.style.animationDelay = (0.5 + i * 0.04) + 's';
      fx.appendChild(s);
    }
    $('gifts').appendChild(fx);
    setTimeout(() => fx.remove(), 4200);
  }

      </g>

      <defs>
        <radialGradient id="micGrad">
          <stop offset="0" stop-color="#555"/>
          <stop offset="1" stop-color="#111"/>
        </radialGradient>
      </defs>
    </svg>
  `;

  function spawnConcierto() {
    const fx = document.createElement('div');
    fx.className = 'fx-concierto';
    fx.innerHTML = `
      <div class="stage"></div>
      <div class="beam a"></div>
      <div class="beam b"></div>
      <div class="banner">Concierto D+M<small>en vivo · esta noche</small></div>
      <div class="band">${CONCIERTO_SVG}</div>
    `;
    $('gifts').appendChild(fx);
    // Floating music notes
    const notes = ['♪','♫','♩','🎵','🎶'];
    for (let i = 0; i < 18; i++) {
      const n = document.createElement('div');
      n.className = 'note';
      n.textContent = notes[i % notes.length];
      n.style.left = (5 + Math.random() * 90) + '%';
      n.style.top = (45 + Math.random() * 30) + '%';
      n.style.animationDelay = (0.4 + Math.random() * 3.5) + 's';
      n.style.fontSize = (18 + Math.random() * 18) + 'px';
      fx.appendChild(n);
    }
    setTimeout(() => fx.remove(), 6200);
  }

  async function endLive() {
    if (!live) return;
    await sb.from('lives').update({ ended_at: new Date().toISOString() }).eq('id', live.id);
    if (jitsi) { try { jitsi.dispose(); } catch(e){} }
    location.href = '/';
  }

  window.addEventListener('beforeunload', () => {
    // Best-effort: if broadcaster, mark ended
    if (live && me && live.broadcaster_user_id === me.id && !live.ended_at) {
      try { navigator.sendBeacon(`${SUPABASE_URL}/rest/v1/lives?id=eq.${live.id}`,
        new Blob([JSON.stringify({ ended_at: new Date().toISOString() })], { type: 'application/json' })); } catch(e){}
    }
  });

  boot();
</script>

</body>
</html>
