<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E3AAB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070D24" media="(prefers-color-scheme: dark)">
<title>Playlist de la semana · Sextogram</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231E3AAB'/%3E%3Cpath d='M17 26a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm0-11 12-3v11' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    --ground: #EEF1FA; --ground-2: #E4EAF7; --paper: #FFFFFF; --paper-soft: #F7F9FE;
    --ink: #0C1846; --ink-soft: #2C3866; --ink-mute: #556388;
    --line: #DBE1F2; --line-strong: #B9C3E1;
    --school: #1E3AAB; --school-2: #3B5EF0; --school-tint: #DDE4FF;
    --coral: #D91F26; --mint: #35C89A; --lemon: #F5DE3A; --spotify: #1DB954;
    --shadow-sm: 0 1px 2px rgba(12,24,70,.06), 0 4px 14px rgba(12,24,70,.06);
    --shadow-lg: 0 4px 12px rgba(12,24,70,.08), 0 22px 44px rgba(12,24,70,.10);
    --radius: 14px; --radius-lg: 22px;
    --f-display: 'Bricolage Grotesque', system-ui, sans-serif;
    --f-body: 'Manrope', system-ui, sans-serif;
    --f-mono: 'JetBrains Mono', ui-monospace, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #070D24; --ground-2: #0D163B; --paper: #121E4A; --paper-soft: #0F1940;
      --ink: #F5F8FF; --ink-soft: #CBD5F5; --ink-mute: #9CACD9;
      --line: #2C3D75; --line-strong: #364785;
      --school: #7091FF; --school-2: #9DB3FF; --school-tint: #1A2A6B;
      --coral: #FF6B72; --mint: #52D9AE; --lemon: #FFE85B;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.35);
      --shadow-lg: 0 4px 12px rgba(0,0,0,.55), 0 22px 44px rgba(0,0,0,.45);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: var(--f-body); color: var(--ink); background: var(--ground); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .nav { position: sticky; top: 0; z-index: 40; backdrop-filter: saturate(140%) blur(14px); background: color-mix(in oklab, var(--ground) 78%, transparent); border-bottom: 1px solid var(--line); }
  .nav-inner { display: flex; align-items: center; gap: 10px; padding: 12px 20px; max-width: 900px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 16px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 7px; background: #fff; object-fit: contain; padding: 2px; box-shadow: 0 1px 3px rgba(12,24,70,.15); }
  .brand em { font-style: normal; color: var(--school); }
  .nav-back { margin-left: auto; padding: 7px 14px; border-radius: 999px; font-family: var(--f-mono); font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--line); }
  .nav-back:hover { border-color: var(--line-strong); }

  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 20px 80px; }

  .head { margin-bottom: 20px; }
  .head-tag { font-family: var(--f-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--school); font-weight: 700; }
  .head h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 5vw, 46px); line-height: 1; letter-spacing: -.03em; margin: 10px 0 6px; }
  .head p { color: var(--ink-soft); font-size: 15px; margin: 0; }
  .head .week { font-family: var(--f-mono); font-size: 12px; color: var(--ink-mute); margin-top: 6px; }

  .db-notice { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; color: var(--ink-mute); margin: 6px 0 16px; }
  .db-notice.offline { color: var(--coral); }

  /* Canción de la semana */
  .sotw {
    background: linear-gradient(135deg, var(--school), var(--school-2));
    color: #fff; border-radius: var(--radius-lg); padding: 20px; margin-bottom: 22px;
    display: flex; gap: 18px; align-items: center; box-shadow: var(--shadow-lg);
    position: relative; overflow: hidden;
  }
  .sotw::after { content: "♪"; position: absolute; right: -10px; bottom: -30px; font-size: 160px; opacity: .12; line-height: 1; }
  .sotw-cover { width: 96px; height: 96px; border-radius: 12px; object-fit: cover; flex-shrink: 0; box-shadow: 0 8px 20px rgba(0,0,0,.35); background: rgba(255,255,255,.15); }
  .sotw-body { flex: 1; min-width: 0; position: relative; z-index: 1; }
  .sotw-label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; opacity: .85; }
  .sotw-name { font-family: var(--f-display); font-weight: 800; font-size: clamp(20px, 3vw, 28px); line-height: 1.05; margin: 4px 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sotw-artists { font-size: 14px; opacity: .9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sotw-likes { margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-family: var(--f-mono); font-size: 13px; background: rgba(255,255,255,.18); padding: 5px 12px; border-radius: 999px; }

  /* toolbar */
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .count-pill { font-family: var(--f-mono); font-size: 12px; color: var(--ink-soft); background: var(--paper); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; }
  .add-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: var(--spotify); color: #fff; font-weight: 800; font-size: 14px; box-shadow: 0 6px 16px rgba(29,185,84,.3); transition: transform .12s; }
  .add-btn:hover { transform: translateY(-1px); }
  .add-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .add-btn svg { width: 16px; height: 16px; }

  /* lista */
  .songs { display: flex; flex-direction: column; gap: 10px; }
  .song {
    display: flex; align-items: center; gap: 14px; background: var(--paper);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
    transition: border-color .15s, transform .15s;
  }
  .song:hover { border-color: var(--line-strong); }
  .song-rank { font-family: var(--f-display); font-weight: 800; font-size: 18px; color: var(--ink-mute); width: 22px; text-align: center; flex-shrink: 0; }
  .song-cover { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: var(--paper-soft); }
  .song-info { flex: 1; min-width: 0; }
  .song-name { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song-artists { font-size: 13px; color: var(--ink-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .play-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--spotify); color: #fff; flex-shrink: 0; transition: transform .12s; }
  .play-btn:hover { transform: scale(1.08); }
  .play-btn svg { width: 18px; height: 18px; }
  .like-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: transparent; border: 1px solid var(--line); color: var(--ink-mute); font-family: var(--f-mono); font-size: 13px; font-weight: 700; transition: all .15s; }
  .like-btn svg { width: 15px; height: 15px; }
  .like-btn:hover:not(:disabled) { color: var(--coral); border-color: var(--coral); }
  .like-btn.liked { color: var(--coral); border-color: var(--coral); background: color-mix(in oklab, var(--coral) 12%, var(--paper)); }
  .like-btn.liked svg { fill: var(--coral); }
  .like-btn:disabled { opacity: .5; cursor: not-allowed; }
  .del-btn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-mute); border: 1px solid var(--line); }
  .del-btn:hover { color: var(--coral); border-color: var(--coral); }
  .del-btn svg { width: 14px; height: 14px; }

  .empty { text-align: center; padding: 40px 20px; color: var(--ink-mute); background: var(--paper-soft); border: 1px dashed var(--line-strong); border-radius: var(--radius); }
  .empty svg { width: 40px; height: 40px; opacity: .5; margin-bottom: 10px; }

  /* modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(7,13,36,.55); backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center; z-index: 100; padding: 40px 16px; overflow-y: auto; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); width: 100%; max-width: 520px; box-shadow: var(--shadow-lg); overflow: hidden; }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 20px 20px 12px; }
  .modal-head h3 { font-family: var(--f-display); font-weight: 800; font-size: 20px; margin: 0; }
  .modal-head p { color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .modal-close { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-mute); border: 1px solid var(--line); flex-shrink: 0; }
  .modal-body { padding: 0 20px 20px; }
  .search-row { position: relative; margin-bottom: 12px; }
  .search-row input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--paper-soft); color: var(--ink); font: inherit; font-size: 15px; outline: none; }
  .search-row input:focus { border-color: var(--spotify); background: var(--paper); }
  .search-results { display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow-y: auto; }
  .result { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; text-align: left; width: 100%; }
  .result:hover { background: var(--paper-soft); border-color: var(--line); }
  .result img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--paper-soft); }
  .result-info { flex: 1; min-width: 0; }
  .result-name { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result-artists { font-size: 12px; color: var(--ink-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .search-hint { font-family: var(--f-mono); font-size: 12px; color: var(--ink-mute); text-align: center; padding: 16px; }
  .search-hint.err { color: var(--coral); }

  .spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--spotify); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 560px) {
    .song-artists { display: none; }
    .like-btn span { display: inline; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand"><img class="brand-mark" src="/logo-sextogram.png" alt="Sextogram"><span>Sexto<em>gram</em></span></a>
    <a href="/" class="nav-back">← Volver</a>
  </div>
</nav>

<main class="wrap">
  <div class="head">
    <div class="head-tag">♪ Playlist colaborativa</div>
    <h1>La playlist de la semana</h1>
    <p>Poné hasta 10 canciones (anónimas). La más likeada es la <b>canción de la semana</b>.</p>
    <div class="week" id="weekLabel">—</div>
  </div>

  <div class="db-notice" id="dbNotice">Conectando…</div>

  <div id="sotwHost"></div>

  <div class="toolbar">
    <span class="count-pill" id="countPill">0 / 10 canciones</span>
    <button class="add-btn" id="addBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Agregar canción
    </button>
  </div>

  <div class="songs" id="songsList"></div>
</main>

<!-- Modal buscar -->
<div class="modal-backdrop" id="searchModal">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h3>Buscar en Spotify</h3>
        <p>Escribí el nombre de la canción o artista.</p>
      </div>
      <button class="modal-close" id="searchClose"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="search-row"><input id="searchInput" type="text" placeholder="Ej. Bad Bunny, Feid, tu canción favorita…" autocomplete="off"></div>
      <div class="search-results" id="searchResults"></div>
      <div class="search-hint" id="searchHint">Empezá a escribir para buscar.</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://qmxugyqwgptgafitbquw.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFteHVneXF3Z3B0Z2FmaXRicXV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzOTQ0NDcsImV4cCI6MjEwMzk3MDQ0N30.AtfxRuD_zSojiVCW170wmQjZudRQJyUl_mdm_L5ii_I';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

  const MAX_SONGS = 10;
  let me = null, myProfile = null;
  let songs = [];
  let likes = new Map();            // song_id -> Set(user_id)
  let profileByUid = new Map();     // user_id -> "section-slug" (para dedup de likes por persona)
  const $ = id => document.getElementById(id);

  // ---- semana ISO (ej. 2026-W37) ----
  function isoWeek(d) {
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = (date.getUTCDay() + 6) % 7;
    date.setUTCDate(date.getUTCDate() - dayNum + 3);
    const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
    const week = 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
    return `${date.getUTCFullYear()}-W${String(week).padStart(2, '0')}`;
  }
  const CURRENT_WEEK = isoWeek(new Date());

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function likesFor(id) { return likes.get(id) || new Set(); }
  function iLiked(id) { return !!(me && likesFor(id).has(me.id)); }
  // Cuenta likes por PERSONA, no por uid: dedup por perfil (name+section).
  // Los likes de uids que ya no tienen perfil (sesiones viejas/otro dispositivo)
  // se ignoran, así no se puede inflar el conteo dando like desde varias sesiones.
  function likeCount(id) {
    const seen = new Set();
    for (const uid of likesFor(id)) {
      const key = profileByUid.get(uid);
      if (key) seen.add(key);      // solo cuenta likers con perfil vivo, 1 por persona
    }
    return seen.size;
  }

  const heartSvg = liked => `<svg viewBox="0 0 24 24" fill="${liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
  const playSvg = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;

  function sortedSongs() {
    return [...songs].sort((a, b) => {
      const d = likeCount(b.id) - likeCount(a.id);
      if (d !== 0) return d;
      return new Date(a.created_at) - new Date(b.created_at);
    });
  }

  function render() {
    const list = sortedSongs();
    // canción de la semana
    const sotwHost = $('sotwHost');
    const leader = list[0];
    if (leader && likeCount(leader.id) > 0) {
      sotwHost.innerHTML = `
        <div class="sotw">
          ${leader.cover_url ? `<img class="sotw-cover" src="${escapeHtml(leader.cover_url)}" alt="">` : '<div class="sotw-cover"></div>'}
          <div class="sotw-body">
            <div class="sotw-label">★ Canción de la semana</div>
            <div class="sotw-name">${escapeHtml(leader.name)}</div>
            <div class="sotw-artists">${escapeHtml(leader.artists)}</div>
            <span class="sotw-likes">${heartSvg(true)} ${likeCount(leader.id)} likes</span>
          </div>
        </div>`;
    } else {
      sotwHost.innerHTML = '';
    }

    $('countPill').textContent = `${songs.length} / ${MAX_SONGS} canciones`;
    $('addBtn').disabled = songs.length >= MAX_SONGS;

    const el = $('songsList');
    if (!list.length) {
      el.innerHTML = `<div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <div>Todavía no hay canciones esta semana.<br>Sé el primero en agregar una.</div>
      </div>`;
      return;
    }
    el.innerHTML = list.map((s, i) => {
      const n = likeCount(s.id);
      const liked = iLiked(s.id);
      const mine = me && s.author_user_id === me.id;
      return `<div class="song" data-id="${s.id}">
        <div class="song-rank">${i + 1}</div>
        ${s.cover_url ? `<img class="song-cover" src="${escapeHtml(s.cover_url)}" alt="">` : '<div class="song-cover"></div>'}
        <div class="song-info">
          <div class="song-name">${escapeHtml(s.name)}</div>
          <div class="song-artists">${escapeHtml(s.artists)}</div>
        </div>
        <div class="song-actions">
          <button class="like-btn ${liked ? 'liked' : ''}" data-like="${s.id}" ${myProfile ? '' : 'disabled title="Reclamá tu nombre en la home para dar like"'}>${heartSvg(liked)}<span>${n}</span></button>
          <a class="play-btn" href="${escapeHtml(s.spotify_url)}" target="_blank" rel="noopener" title="Escuchar en Spotify">${playSvg}</a>
          ${mine ? `<button class="del-btn" data-del="${s.id}" title="Quitar tu canción"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>` : ''}
        </div>
      </div>`;
    }).join('');

    el.querySelectorAll('[data-like]').forEach(b => b.addEventListener('click', () => toggleLike(b.dataset.like)));
    el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => delSong(b.dataset.del)));
  }

  async function loadAll() {
    const [{ data: sg, error: se }, { data: lk, error: le }, { data: pf, error: pe }] = await Promise.all([
      sb.from('songs').select('id, spotify_id, name, artists, cover_url, spotify_url, author_user_id, created_at').eq('week', CURRENT_WEEK).order('created_at', { ascending: true }),
      sb.from('song_likes').select('song_id, user_id'),
      sb.from('profiles').select('user_id, name, section'),
    ]);
    if (!se) songs = sg || [];
    if (!pe) {
      profileByUid = new Map();
      (pf || []).forEach(p => profileByUid.set(p.user_id, p.section + '|' + p.name));
    }
    if (!le) {
      likes = new Map();
      (lk || []).forEach(l => { const s = likes.get(l.song_id) || new Set(); s.add(l.user_id); likes.set(l.song_id, s); });
    }
    render();
  }

  async function toggleLike(id) {
    if (!myProfile || !me) { alert('Reclamá tu nombre en la home para dar like.'); return; }
    const already = iLiked(id);
    const set = likes.get(id) || new Set();
    if (already) set.delete(me.id); else set.add(me.id);
    likes.set(id, set); render();
    const q = already
      ? sb.from('song_likes').delete().eq('song_id', id).eq('user_id', me.id)
      : sb.from('song_likes').insert({ song_id: id, user_id: me.id });
    const { error } = await q;
    if (error) { if (already) set.add(me.id); else set.delete(me.id); likes.set(id, set); render(); alert('No se pudo: ' + error.message); }
  }

  async function delSong(id) {
    if (!confirm('¿Quitar tu canción de la lista?')) return;
    const { error } = await sb.from('songs').delete().eq('id', id);
    if (error) { alert('No se pudo borrar: ' + error.message); return; }
    songs = songs.filter(s => s.id !== id); likes.delete(id); render();
  }

  // ---- buscar + agregar ----
  const searchModal = $('searchModal'), searchInput = $('searchInput'), searchResults = $('searchResults'), searchHint = $('searchHint');
  let searchTimer = null;

  $('addBtn').addEventListener('click', () => {
    if (!myProfile) { alert('Reclamá tu nombre en la home para agregar canciones.'); return; }
    if (songs.length >= MAX_SONGS) { alert('Ya hay 10 canciones esta semana. Esperá al reinicio.'); return; }
    searchInput.value = ''; searchResults.innerHTML = ''; searchHint.hidden = false; searchHint.className = 'search-hint'; searchHint.textContent = 'Empezá a escribir para buscar.';
    searchModal.classList.add('open'); setTimeout(() => searchInput.focus(), 50);
  });
  $('searchClose').addEventListener('click', () => searchModal.classList.remove('open'));
  searchModal.addEventListener('click', e => { if (e.target === searchModal) searchModal.classList.remove('open'); });

  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const q = searchInput.value.trim();
    if (!q) { searchResults.innerHTML = ''; searchHint.hidden = false; searchHint.className = 'search-hint'; searchHint.textContent = 'Empezá a escribir para buscar.'; return; }
    searchHint.hidden = false; searchHint.className = 'search-hint'; searchHint.innerHTML = '<span class="spinner"></span> Buscando…';
    searchResults.innerHTML = '';
    searchTimer = setTimeout(() => doSearch(q), 350);
  });

  async function doSearch(q) {
    try {
      const r = await fetch('/api/spotify?q=' + encodeURIComponent(q));
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        throw new Error(j.error === 'spotify_not_configured' ? 'Falta configurar Spotify (avisá al admin).' : 'Error buscando.');
      }
      const { tracks } = await r.json();
      if (!tracks || !tracks.length) { searchHint.hidden = false; searchHint.className = 'search-hint'; searchHint.textContent = 'Sin resultados.'; searchResults.innerHTML = ''; return; }
      searchHint.hidden = true;
      searchResults.innerHTML = tracks.map(t => `
        <button class="result" data-track='${escapeHtml(JSON.stringify(t))}'>
          ${t.cover ? `<img src="${escapeHtml(t.cover)}" alt="">` : '<div style="width:44px;height:44px;border-radius:8px;background:var(--paper-soft)"></div>'}
          <div class="result-info"><div class="result-name">${escapeHtml(t.name)}</div><div class="result-artists">${escapeHtml(t.artists)}</div></div>
        </button>`).join('');
      searchResults.querySelectorAll('.result').forEach(b => b.addEventListener('click', () => addSong(JSON.parse(b.dataset.track))));
    } catch (e) {
      searchHint.hidden = false; searchHint.className = 'search-hint err'; searchHint.textContent = e.message || 'Error buscando.';
    }
  }

  async function addSong(t) {
    if (songs.length >= MAX_SONGS) { alert('Ya hay 10 canciones esta semana.'); return; }
    if (songs.find(s => s.spotify_id === t.id)) { alert('Esa canción ya está en la lista.'); searchModal.classList.remove('open'); return; }
    const { error } = await sb.from('songs').insert({
      week: CURRENT_WEEK, spotify_id: t.id, name: t.name, artists: t.artists,
      cover_url: t.cover, spotify_url: t.url, author_user_id: me.id,
    });
    if (error) {
      const msg = /row-level security|violates|check/i.test(error.message) ? 'No se pudo agregar (¿ya hay 10, o falta reclamar tu nombre?).' : error.message;
      alert(msg); return;
    }
    searchModal.classList.remove('open');
    // realtime la agrega; por si acaso recargamos
    loadAll();
  }

  // ---- realtime ----
  function subscribe() {
    sb.channel('songs-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'songs' }, () => loadAll())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'song_likes' }, () => loadAll())
      .subscribe();
  }

  async function init() {
    $('weekLabel').textContent = 'Semana ' + CURRENT_WEEK + ' · se reinicia cada lunes';
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (session && session.user) me = session.user;
      else { const { data } = await sb.auth.signInAnonymously(); me = data.user; }
    } catch (e) {
      $('dbNotice').className = 'db-notice offline'; $('dbNotice').textContent = 'Sin conexión · reintentá'; return;
    }
    // mi perfil (para poder agregar/likear)
    if (me) {
      const { data: prof } = await sb.from('profiles').select('user_id, name, section').eq('user_id', me.id).maybeSingle();
      myProfile = prof || null;
    }
    $('dbNotice').textContent = myProfile
      ? 'Sincronizado en vivo · Spotify + Supabase'
      : 'Podés escuchar y ver la lista. Para agregar o dar like, reclamá tu nombre en la home.';
    await loadAll();
    subscribe();
  }
  init();
</script>
</body>
</html>
